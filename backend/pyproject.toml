# ============================================================
# OptiWallet Backend — Python Project Configuration
# ============================================================

[project]
name = "optiwallet-backend"
version = "0.1.0"
description = "OptiWallet AI-powered shopping advisor — BTK Hackathon 2026"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Yunus Emre Yeğin", email = "yunus@optiwallet.app" }
]

dependencies = [
    # ===== Web Framework =====
    "fastapi[all]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # ===== Validation & Settings =====
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # ===== Database =====
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",

    # ===== Cache & Queue =====
    "redis[hiredis]>=5.2.0",
    "celery[redis]>=5.4.0",
    "celery-redbeat>=2.2.0",

    # ===== AI & LangGraph =====
    "google-genai>=0.3.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.50",
    "langchain-community>=0.3.0",

    # ===== Authentication & Security =====
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.0",
    "cryptography>=43.0.0",

    # ===== HTTP Clients =====
    "httpx>=0.28.0",
    "aiohttp>=3.11.0",

    # ===== Storage =====
    "boto3>=1.35.0",
    "minio>=7.2.0",
    "pillow>=11.0.0",

    # ===== Email =====
    "resend>=2.5.0",

    # ===== Utilities =====
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "python-slugify>=8.0.4",
    "babel>=2.16.0",

    # ===== Monitoring & Logging =====
    "sentry-sdk[fastapi]>=2.18.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    # ===== Testing =====
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
    "faker>=33.0.0",

    # ===== Code Quality =====
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
    "pre-commit>=4.0.0",

    # ===== Type Stubs =====
    "types-python-jose>=3.3.0",
    "types-passlib>=1.7.7",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ============================================================
# Ruff — Linter & Formatter
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "A",   # flake8-builtins
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (Black halleder)
    "B008",  # function call in default argument (FastAPI Depends pattern)
    "S101",  # use of assert (testlerde gerekli)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"alembic/*" = ["E402"]

# ============================================================
# Black — Code Formatter
# ============================================================
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | alembic/versions
)/
'''

# ============================================================
# Mypy — Type Checker
# ============================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "minio.*",
    "qrcode.*",
]
ignore_missing_imports = true

# ============================================================
# Pytest — Test Configuration
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=70",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "app/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]